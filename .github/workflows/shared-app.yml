name: Shared app and web checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  frontend:
    name: Shared TypeScript, login/privacy and Webapp checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: node scripts/test_dev.cjs
      - run: node scripts/test_vercel.cjs
      - run: npm run typecheck
        working-directory: app
      - run: npm run test:flows
        working-directory: app
      - run: npm run test:webapp
        working-directory: app

  backend:
    name: API and trained-model checks (offline embeddings)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      MODEL_EMBEDDINGS_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install real OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-tha libgomp1
      - name: Install pinned dependencies with CPU-only Torch
        run: |
          python -m pip install 'torch==2.7.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Test API and small committed trained models
        run: |
          mkdir -p .runtime/ci
          python -m pytest backend/tests ml/tests -q -rs --junitxml=.runtime/ci/backend-tests.xml
          python -m ml validate ml/datasets/sample.jsonl
          python -m ml evaluate ml/datasets/sample.jsonl --artifacts ml/artifacts/default
      - name: Upload test results, including explicit skips
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-model-tests-${{ github.sha }}
          path: .runtime/ci/backend-tests.xml
          if-no-files-found: warn
          retention-days: 14

  exports:
    name: ${{ matrix.platform }} export from shared source
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            directory: app/dist
            artifact: web-static
          - platform: android
            directory: .runtime/ci-native/android
            artifact: android-js-bundle-not-apk
          - platform: ios
            directory: .runtime/ci-native/ios
            artifact: ios-js-bundle-not-ipa
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_DIRECTORY: ${{ matrix.directory }}
      BUILD_ARTIFACT: ${{ matrix.artifact }}
      BUILD_GIT_SHA: ${{ github.sha }}
      WEB_API_URL: ${{ vars.WEB_API_URL || '/api' }}
      NATIVE_API_URL: ${{ vars.NATIVE_API_URL || 'https://api.example.invalid/api' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: app
      - name: Validate public build configuration before export
        run: python scripts/ci_release_manifest.py --validate-config
      - name: Build shared source for selected platform
        working-directory: app
        run: |
          if [ "$BUILD_PLATFORM" = web ]; then
            EXPO_PUBLIC_API_URL="$WEB_API_URL" npm run build
          else
            EXPO_PUBLIC_API_URL="$NATIVE_API_URL" npx expo export --platform "$BUILD_PLATFORM" --output-dir "../$BUILD_DIRECTORY" --clear
          fi
      - name: Record source SHA and artifact type
        run: python scripts/ci_release_manifest.py
      - name: Upload build output (no publishing or store upload)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 14
