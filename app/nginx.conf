server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/javascript text/javascript text/css text/plain
             application/json application/manifest+json application/wasm
             image/svg+xml font/ttf font/otf application/x-font-ttf
             application/vnd.ms-fontobject;

  location ^~ /api/ {
    gzip off;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }
  # Nginx 1.27's default MIME list omits TTF/OTF; scope these types to font files.
  location ~* \.(ttf|otf)$ {
    types {
      font/ttf ttf;
      font/otf otf;
    }
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
