services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scamgraph}
      POSTGRES_DB: ${POSTGRES_DB:-scamgraph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scamgraph}:${POSTGRES_PASSWORD:-scamgraph}@db:5432/${POSTGRES_DB:-scamgraph}
      MODEL_ARTIFACT_DIR: /srv/ml/artifacts/default
      MODEL_EMBEDDINGS_PATH: /srv/ml/artifacts/embedding-model
    volumes:
      - ./ml/artifacts:/srv/ml/artifacts
      - ./ml/datasets:/srv/ml/datasets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  postgres_data:
